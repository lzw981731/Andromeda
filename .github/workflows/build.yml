name: Build tipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$HOME/theos"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install ldid
        run: brew install ldid

      - name: Build tipa
        run: |
          chmod +x ipabuild.sh
          ./ipabuild.sh

      - name: Upload tipa
        uses: actions/upload-artifact@v4
        with:
          name: Geranium-tipa-${{ github.run_number }}
          path: build/Geranium.tipa
          if-no-files-found: error
